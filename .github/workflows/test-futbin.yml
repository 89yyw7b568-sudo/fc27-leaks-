
name: Test FUTWIZ Access

on:
  workflow_dispatch:

jobs:
  test-futwiz:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Test FUTWIZ access
        run: python -c "import requests; u='https://www.futwiz.com/fc27/players'; r=requests.get(u, headers={'User-Agent':'Mozilla/5.0'}, timeout=30); print('URL:',r.url); print('HTTP status:',r.status_code); print('Page length:',len(r.text)); print('Preview:',r.text[:500])"
